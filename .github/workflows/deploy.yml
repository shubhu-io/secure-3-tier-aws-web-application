name: Deploy

# Runs when code lands on main.
# Generic pipeline driven by stack.json:
#   build + scan + push every service to ECR -> update SSM params
#     -> trigger ASG instance refresh -> smoke test -> (optional) EKS deploy
#
# Required GitHub repository secrets:
#   AWS_ACCESS_KEY_ID       IAM user keys (attach the CI/CD IAM policy)
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION              e.g. eu-west-1
#   ALB_URL                 e.g. http://secure-ntier-dev-alb-xxxx.eu-west-1.elb.amazonaws.com
#   ECR_PROJECT             e.g. secure-ntier
#   ECR_ENV                 e.g. dev

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq (if missing)
        run: command -v jq || sudo apt-get install -y jq

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        run: bash cicd/scripts/ecr-login.sh "${{ secrets.AWS_REGION }}"

      - name: Build + scan + push every service
        run: bash cicd/scripts/stack-push.sh "${{ github.sha }}" "${{ secrets.AWS_REGION }}" "${{ secrets.ECR_PROJECT }}" "${{ secrets.ECR_ENV }}"

      - name: Update deploy parameters + trigger instance refresh
        run: bash cicd/scripts/deploy-ec2.sh "${{ github.sha }}" "${{ secrets.AWS_REGION }}" "${{ secrets.ECR_ENV }}" "${{ secrets.ECR_PROJECT }}"

      - name: Smoke test (wait for healthy app)
        env:
          ALB_URL: ${{ secrets.ALB_URL }}
          ATTEMPTS: "36"
        run: bash cicd/scripts/smoke-test.sh

  deploy-eks:
    name: Deploy to EKS
    # Opt-in: set the repository variable DEPLOY_EKS=true (Settings → Variables).
    # Requires the Terraform EKS module applied (enable_eks=true).
    if: vars.DEPLOY_EKS == 'true'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install kubectl
        run: |
          curl -sLO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Deploy to EKS + smoke test
        run: bash cicd/scripts/deploy-eks.sh "${{ github.sha }}" "${{ secrets.AWS_REGION }}" "${{ secrets.ECR_ENV }}" "${{ secrets.ECR_PROJECT }}"