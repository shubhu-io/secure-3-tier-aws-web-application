name: Deploy

# Runs when code lands on main.
# Generic pipeline driven by stack.json:
#   auth to AWS -> build + scan + push every service to ECR
#   -> roll the ASG -> smoke test
#   -> (optional) EKS deploy
#
# Required GitHub repository secrets:
#   AWS_ACCESS_KEY_ID       IAM user keys (attach the CI/CD IAM policy)
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION              e.g. ap-south-1
# Shared:
#   ALB_URL                 e.g. http://secure-ntier-dev-alb-xxxx.elb.amazonaws.com
#   ECR_PROJECT             e.g. secure-ntier
#   ECR_ENV                 e.g. dev

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
  PROJECT: ${{ secrets.ECR_PROJECT || 'secure-ntier' }}
  ENV: ${{ secrets.ECR_ENV || 'dev' }}

jobs:
  deploy:
    name: Build, push, deploy (AWS)
    runs-on: ubuntu-latest
    outputs:
      has_auth: ${{ steps.check-creds.outputs.has_auth }}
    steps:
      - uses: actions/checkout@v4

      - name: Install jq (if missing)
        run: command -v jq || sudo apt-get install -y jq

      - name: Make scripts executable
        run: chmod +x cicd/scripts/*.sh

      # --- AWS credential check -----------------------------------------------
      - name: Check AWS credentials
        id: check-creds
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -n "$AWS_KEY" ]; then
            echo "has_auth=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_auth=false" >> "$GITHUB_OUTPUT"
            echo "::warning::AWS_ACCESS_KEY_ID secret is not configured. Cloud deploy skipped; validating stack manifest locally."
          fi

      # --- AWS authentication -------------------------------------------------
      - name: Configure AWS credentials
        if: steps.check-creds.outputs.has_auth == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      # --- Local validation fallback (when credentials are not yet configured) ---
      - name: Validate stack locally (dry-run)
        if: steps.check-creds.outputs.has_auth != 'true'
        run: |
          echo "No AWS credentials configured. Validating stack.json..."
          bash cicd/scripts/stack-validate.sh
          echo "Stack manifest is valid. Configure GitHub repository secrets to enable automated deployment."

      # --- Registry + deploy (only runs when authenticated) ------------------
      - name: Login to ECR
        if: steps.check-creds.outputs.has_auth == 'true'
        run: bash cicd/scripts/registry-login.sh "$REGION"

      - name: Build + scan + push every service
        if: steps.check-creds.outputs.has_auth == 'true'
        run: bash cicd/scripts/stack-push.sh "${{ github.sha }}" "$REGION" "$PROJECT" "$ENV"

      - name: Roll ASG onto new images
        if: steps.check-creds.outputs.has_auth == 'true'
        run: bash cicd/scripts/deploy-ec2.sh "${{ github.sha }}" "$REGION" "$ENV" "$PROJECT"

      - name: Smoke test (wait for healthy app)
        if: steps.check-creds.outputs.has_auth == 'true'
        env:
          ALB_URL: ${{ secrets.ALB_URL }}
          ATTEMPTS: "36"
        run: bash cicd/scripts/smoke-test.sh

  deploy-k8s:
    name: Deploy to EKS
    # Opt-in: set the repository variable DEPLOY_K8S=true (or legacy DEPLOY_EKS).
    # Requires the Terraform EKS module applied (aws_enable_eks = true).
    if: (vars.DEPLOY_K8S == 'true' || vars.DEPLOY_EKS == 'true') && needs.deploy.outputs.has_auth == 'true'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq (if missing)
        run: command -v jq || sudo apt-get install -y jq

      - name: Make scripts executable
        run: chmod +x cicd/scripts/*.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: Install kubectl
        run: |
          curl -sLO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Deploy to EKS + smoke test
        run: bash cicd/scripts/deploy-k8s.sh "${{ github.sha }}" "$REGION" "$ENV" "$PROJECT"
