name: Code Examples Validation

on:
  push:
    paths:
      - 'examples/programming/**'
  pull_request:
    paths:
      - 'examples/programming/**'

jobs:
  test-javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/programming/javascript
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run build
        run: npm run build

  test-typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/programming/typescript
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Run tests
        run: npm test

  test-python:
    name: Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/programming/python
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

  test-go:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/programming/go
    steps:
      - uses: actions/checkout@v4

      - name: Install Go dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

  test-rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/programming/rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run tests
        run: cargo test

      - name: Run cargo clippy
        run: cargo clippy -- -Dwarnings

  test-java-maven:
    name: Java Maven
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/programming/java-maven
    steps:
      - uses: actions/checkout@v4

      - name: Set up Maven
        uses: stefanzweifel/setup-maven@v2
        with:
          maven-version: '3.9.8'

      - name: Cache Maven repository
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}

      - name: Compile
        run: mvn clean compile

      - name: Run tests
        run: mvn test

  test-java-gradle:
    name: Java Gradle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/programming/java-gradle
    steps:
      - uses: actions/checkout@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cache Gradle cache
        uses: actions/cache@v3
        with:
          path: ~/.gradle/cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/build.gradle') }}

      - name: Build
        run: ./gradlew build

      - name: Run tests
        run: ./gradlew test

  test-cpp:
    name: C++
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/programming/cpp
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build

  test-csharp:
    name: .NET
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/programming/csharp
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: |
            9.0

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Run tests
        run: dotnet test --no-build