name: CI

# Runs on pull requests and pushes to develop.
# Goal: catch broken code BEFORE it reaches main.
#
# Generic: every job reads the stack.json manifest, so any service (any
# language/framework) is tested, built and scanned with no workflow edits.
#
#   validate        -> stack.json schema + terraform fmt/validate
#   build-and-scan  -> per-service ci_steps (in toolchain containers),
#                      docker build, trivy scan
#
# CLOUD threads the target cloud (aws | azure | gcp) through every script;
# defaults to aws and can be overridden on manual dispatch.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      cloud:
        description: "Cloud to validate against"
        required: false
        default: aws
        type: choice
        options: [aws, azure, gcp]

env:
  CLOUD: ${{ inputs.cloud || 'aws' }}

jobs:
  validate:
    name: Manifest + Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq (if missing)
        run: command -v jq || sudo apt-get install -y jq

      - name: Validate stack manifest
        run: bash cicd/scripts/stack-validate.sh

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: terraform validate
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

  iac-security-scan:
    name: IaC security scan (tfsec + checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.4
        with:
          working_directory: terraform
          # severity THRESHOLD=HIGH means CRITICAL + HIGH fail the job
          additional_args: --config-file /github/workspace/.tfsec

      - name: Run checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          config_file: .checkov.yml
          output_format: cli

  build-and-scan:
    name: Build + scan all services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq (if missing)
        run: command -v jq || sudo apt-get install -y jq

      - name: CI per service (test, audit, build, trivy scan)
        run: bash cicd/scripts/stack-ci.sh