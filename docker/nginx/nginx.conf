# ============================================================================
# Nginx server config for the frontend container.
# Serves the built React app and reverse-proxies API calls to the backend
# service ("backend" is the Docker Compose service name / network alias).
# ============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker embedded DNS - re-resolve "backend" per request so nginx
    # survives backend restarts/replacements (no startup DNS race, no
    # stale cached IP after the backend container is recreated).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:3000;

    # API -> backend container
    location /api/ {
        proxy_pass $backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health checks (ALB + compose) go straight to the backend
    location = /health {
        proxy_pass $backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Readiness probe used by the ALB target-group health check
    location = /health/ready {
        proxy_pass $backend/health/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic cache headers for static assets
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
