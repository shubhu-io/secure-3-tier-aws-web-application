# ============================================================================
# Local development stack (NO AWS required)
#   docker compose up --build
#   curl http://localhost/health
# ============================================================================

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: local-dev-password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    environment:
      PORT: "3000"
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: appdb
      DB_USER: app_user
      DB_PASSWORD: local-dev-password
      JWT_SECRET: local-dev-secret-change-me-1234567890
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
