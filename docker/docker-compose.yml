# ============================================================================
# Local development stack (NO AWS required)
#   bash scripts/local-up.sh          # recommended (includes health wait)
#   docker compose up --build          # or directly
#   curl http://localhost:3000/health
# ============================================================================

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: local-dev-password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    environment:
      PORT: "3000"
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: appdb
      DB_USER: app_user
      DB_PASSWORD: local-dev-password
      JWT_SECRET: local-dev-secret-change-me-1234567890
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
