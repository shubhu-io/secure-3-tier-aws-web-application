# ============================================================================
# Local development stack (NO AWS required)
#   bash docker/scripts/up.sh           # recommended (includes health wait)
#   docker compose up --build           # or directly
#   curl http://localhost:3000/health
#
# All overridable values are read from docker/.env (see .env.example).
# Compose picks up docker/.env automatically for ${VAR} interpolation and
# falls back to the safe local-development defaults shown below.
# ============================================================================

name: secure-ntier-local

services:
  db:
    build:
      context: ..
      dockerfile: docker/database/Dockerfile
    environment:
      POSTGRES_DB: ${DB_NAME:-appdb}
      POSTGRES_USER: ${DB_USER:-app_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-dev-password}
    ports:
      - "${DB_PORT_MAP:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app_user} -d ${DB_NAME:-appdb}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    environment:
      PORT: "3000"
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-appdb}
      DB_USER: ${DB_USER:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:-local-dev-password}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-1234567890}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT_MAP:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT_MAP:-80}:80"

volumes:
  pgdata: