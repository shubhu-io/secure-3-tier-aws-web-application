# ============================================================================
# Observability overlay - Prometheus + Grafana + Loki + Blackbox
# Usage:
#   docker compose -f docker/docker-compose.yml \
#     -f docker/docker-compose.monitoring.yml up --build -d
#   Grafana:   http://localhost:3001 (admin/admin)
#   Prometheus http://localhost:9090
#   Loki:      http://localhost:3100
# EC2 prod: same file is reused by user-data (monitoring profile opt-in).
# ============================================================================

services:
  prometheus:
    image: prom/prometheus:v2.52.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROM_PORT_MAP:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.3
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT_MAP:-3001}:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.6
    command: ['-config.file=/etc/loki/loki.yml']
    volumes:
      - ../monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
    ports:
      - "3100:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.6
    command: ['-config.file=/etc/promtail/promtail.yml']
    volumes:
      - ../monitoring/loki/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.1
    ports:
      - "9100:9100"
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    command:
      - '--config.file=/etc/blackbox/blackbox.yml'
    volumes:
      - ../monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    ports:
      - "9115:9115"
    restart: unless-stopped

volumes:
  grafana-data:
