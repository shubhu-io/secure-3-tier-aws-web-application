# SonarQube project configuration.
# Run with: sonar-scanner (or in CI: docker run --rm -v "$PWD:/usr/src" \
#   sonarsource/sonar-scanner-cli)
#
# SONAR_HOST_URL + SONAR_TOKEN are expected from the environment / Jenkins
# credentials - never commit them here.

sonar.projectKey=secure-ntier-cloud-platform
sonar.projectName=secure-ntier-cloud-platform
sonar.organization=

# Sources to analyse (application code only)
sonar.sources=application/backend/src,application/frontend/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

# Tests
sonar.tests=application/backend/test
sonar.test.inclusions=**/*.test.js,**/*.spec.js
sonar.javascript.lcov.reportPaths=application/frontend/coverage/lcov.info

# Analysis settings
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.min.js

# Quality gates
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300