---
- name: Harden sshd configuration
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?\\s*{{ item.key }}\\s+"
    line: "{{ item.key }} {{ item.value }}"
    validate: "/usr/sbin/sshd -t -f %s"
  loop:
    - { key: PasswordAuthentication, value: "{{ sshd_password_auth }}" }
    - { key: PermitRootLogin, value: "{{ sshd_permit_root_login }}" }
    - { key: AllowUsers, value: "{{ ssh_allow_users }}" }
    - { key: X11Forwarding, value: "no" }
    - { key: MaxAuthTries, value: "3" }
    - { key: ClientAliveInterval, value: "300" }
  notify: restart sshd

- name: Install auditd
  ansible.builtin.package:
    name: audit
    state: present

- name: Enable auditd
  ansible.builtin.service:
    name: auditd
    enabled: true
    state: started

- name: Enable unattended security updates
  ansible.builtin.package:
    name: "{{ 'unattended-upgrades' if ansible_facts['os_family'] == 'Debian' else 'dnf-automatic' }}"
    state: present

- name: Set umask for logins
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "^UMASK"
    line: "UMASK           027"
